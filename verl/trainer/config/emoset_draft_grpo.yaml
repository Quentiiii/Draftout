defaults:
  - emoset_grpo
  - _self_

# Same model, data, optimizer, PPO loss aggregation and KL settings as GRPO.
# Same sampled images, with a separate cache for EMOTION_ANALYSIS_DRAFT_PROMPT.
data_dir: ${project_root}/outputs/emoset_grpo/data_draft_8k_seed42

algorithm:
  adv_estimator: draft_grpo
  norm_adv_by_std_in_grpo: false

draft_grpo:
  num_drafts: 2
  num_continuations_per_draft: 2
  ema_beta: 0.9
  shrink_min: 0.1
  eps: 1.0e-6
  # Warm up fresh runs; resumed checkpoints continue directly with Draft updates.
  warmup_steps: 20
  warmup_on_resume: false

actor_rollout_ref:
  rollout:
    agent:
      agent_loop_manager_class: emotion_grpo.draft_rollout.DraftAgentLoopManager

custom_reward_function:
  name: compute_draft_score

trainer:
  experiment_name: emoset_draft_grpo_2b_8k_warmup20_fallback
  # Keep leaf IDs/prefix boundaries inspectable with the existing JSONL logger.
  rollout_data_dir: ${trainer.default_local_dir}/rollout
